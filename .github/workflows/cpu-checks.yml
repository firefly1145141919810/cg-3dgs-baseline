name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: python -m pip install numpy==1.26.4 Pillow==10.4.0 plyfile==1.0.3
      - name: Obtain pinned upstream Python argument definitions
        run: git submodule update --init vendor/gaussian-splatting
      - name: CPU regression tests
        run: python -m unittest discover -s tests -v
      - name: Optimized-mode regression tests
        run: python -O -m unittest discover -s tests -q
      - name: Static and public-tree checks
        run: |
          python scripts/static_check.py
          python scripts/check_public_repo.py
      - name: Audit published experiment evidence
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import build_report_assets as b; print(b.audit()[2])"
